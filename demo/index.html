<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codemirror-sql playground</title>
    <meta
      name="description"
      content="Interactive codemirror-sql language-service playground"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .sql-completion-info { min-width: 220px; padding: 8px; }
      .sql-completion-info div { color: #64748b; margin-top: 4px; }
      .cm-sql-statement-gutter { --cm-sql-statement-color: #2563eb; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main class="max-w-5xl mx-auto px-4 py-8">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
        <div>
          <h1 class="text-4xl font-bold">
            <a
              href="https://github.com/marimo-team/codemirror-sql"
              class="text-blue-600 hover:text-blue-800"
            >codemirror-sql</a>
          </h1>
          <p class="text-slate-600 mt-2">
            The SQL language service running against a live in-memory catalog.
          </p>
        </div>
        <span class="rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-800">
          Standard API
        </span>
      </div>

      <section class="mt-8">
        <div class="flex flex-wrap items-end justify-between gap-3 mb-3">
          <div>
            <h2 class="text-2xl font-bold">Interactive editor</h2>
            <p class="text-sm text-slate-600">
              Start typing or press <strong>Ctrl-Space</strong> for completion.
              The gutter tracks statement boundaries.
            </p>
          </div>
          <div class="flex flex-wrap gap-2">
            <label class="text-sm">
              <span class="block text-slate-500">Dialect</span>
              <select id="database-select" class="border rounded-md bg-white p-1.5">
                <option value="duckdb">DuckDB</option>
                <option value="postgresql">PostgreSQL</option>
                <option value="bigquery">BigQuery</option>
                <option value="dremio">Dremio</option>
              </select>
            </label>
            <label class="text-sm">
              <span class="block text-slate-500">Provider latency</span>
              <select id="latency-select" class="border rounded-md bg-white p-1.5">
                <option value="0">Instant</option>
                <option value="150">150 ms</option>
                <option value="600">600 ms</option>
              </select>
            </label>
            <button
              id="invalidate-catalog"
              class="self-end border rounded-md bg-white px-3 py-1.5 text-sm hover:bg-slate-100"
            >
              Invalidate catalog
            </button>
          </div>
        </div>
        <div class="border rounded-lg bg-white shadow-sm overflow-hidden">
          <div id="sql-editor" class="min-h-[400px] overflow-y-auto"></div>
          <div
            class="border-t bg-slate-50 px-3 py-2 text-xs text-slate-500"
            id="provider-stats"
          ></div>
        </div>
      </section>

      <section class="mt-8">
        <h2 class="text-2xl font-bold mb-2">Completion scenarios</h2>
        <p class="text-slate-600 mb-4">
          The <strong>|</strong> marks where completion opens.
        </p>
        <div class="grid gap-3 md:grid-cols-2">
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="SELECT * FROM us|"
          >
            <strong>Relation completion</strong>
            <code class="block mt-2 text-sm text-blue-700">SELECT * FROM us|</code>
          </button>
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="SELECT u.| FROM main.users AS u"
          >
            <strong>Qualified columns</strong>
            <code class="block mt-2 text-sm text-blue-700">SELECT u.| FROM main.users AS u</code>
          </button>
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="SELECT u.| FROM main.users u WHERE EXISTS (SELECT 1 FROM sales.orders o)"
          >
            <strong>Correlated scope</strong>
            <code class="block mt-2 text-sm text-blue-700">SELECT u.| ... WHERE EXISTS (...)</code>
          </button>
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="SELECT * FROM sa|"
          >
            <strong>Namespace completion</strong>
            <code class="block mt-2 text-sm text-blue-700">SELECT * FROM sa|</code>
          </button>
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="WITH recent AS (SELECT * FROM sales.orders) SELECT * FROM rec|"
          >
            <strong>CTE visibility</strong>
            <code class="block mt-2 text-sm text-blue-700">WITH recent AS (...) SELECT * FROM rec|</code>
          </button>
          <button
            class="example-btn rounded-lg border bg-white p-4 text-left hover:border-blue-400"
            data-sql="SELECT * FROM main.users u, LATERAL (SELECT u.| FROM sales.orders o) x, sales.customers c"
          >
            <strong>LATERAL scope</strong>
            <code class="block mt-2 text-sm text-blue-700">..., LATERAL (SELECT u.| ...)</code>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
